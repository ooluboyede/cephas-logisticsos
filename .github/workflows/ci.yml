name: CI

on:
  push:
    branches: [main, "feature/**", "hardening/**", "security/**", "integration/**"]
  pull_request:
    branches: [main, "feature/**", "hardening/**", "security/**", "integration/**", "work/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Make checked-out source read-only
        run: chmod -R a-w src
      - name: Trusted tenant-boundary enforcement
        run: python src/cephas_logisticsos/security/trusted_boundary.py --source src
      - name: Restore source write permissions for package installation
        run: chmod -R u+w src
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check --diff .
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest --cov=cephas_logisticsos --cov-report=term-missing --cov-fail-under=80

  postgresql16:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cephas_t02_test
          POSTGRES_PASSWORD: cephas-ci-disposable-bootstrap
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        options: >-
          --health-cmd "pg_isready -U postgres -d cephas_t02_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute real PostgreSQL foundation tests
        env:
          PG16_CONTAINER_ID: ${{ job.services.postgres.id }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Review head: %s\n' "$REVIEW_HEAD_SHA"
          bash db/tests/run_foundation.sh
